<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shree Samarth Talent Search Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .hall-ticket-card { width: 100%; max-width: 600px; border: 2px solid #333; min-height: 350px; }
        .photo-box { width: 100px; height: 120px; background: #f8f9fa; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .navbar { background-color: #1a237e !important; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark shadow mb-4">
        <div class="container text-white">
            <span class="navbar-brand mb-0 h1">Shree Samarth Talent Search Exam</span>
        </div>
    </nav>
    <div class="container">
        <div class="row">
            <div class="col-md-5 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Student Form</h4>
                    <form id="examForm">
                        <div class="mb-2"><label>Student Name</label><input type="text" id="studentName" class="form-control" required></div>
                        <div class="mb-2"><label>Standard</label><input type="text" id="studentClass" class="form-control" required></div>
                        <div class="mb-2"><label>Exam Center</label><input type="text" id="centerName" class="form-control" required></div>
                        <div class="mb-2"><label>Exam Date</label><input type="date" id="examDate" class="form-control" required></div>
                        <button type="submit" class="btn btn-primary w-100 mt-3">Create Hall Ticket</button>
                    </form>
                </div>
            </div>
            <div class="col-md-7">
                <div id="hallTicket" class="bg-white p-4 shadow mx-auto" style="display:none; border: 2px solid #000;">
                    <div class="text-center border-bottom mb-3">
                        <h3>Shree Samarth Talent Search Exam</h3>
                        <p>Official Hall Ticket</p>
                    </div>
                    <div class="row">
                        <div class="col-8">
                            <p><strong>Name:</strong> <span id="outName"></span></p>
                            <p><strong>Class:</strong> <span id="outClass"></span></p>
                            <p><strong>Center:</strong> <span id="outCenter"></span></p>
                            <p><strong>Date:</strong> <span id="outDate"></span></p>
                        </div>
                        <div class="col-4"><div class="photo-box">Photo</div></div>
                    </div>
                </div>
                <button id="downloadBtn" onclick="downloadPDF()" class="btn btn-success w-100 mt-3" style="display:none;">Download PDF</button>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('examForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('outName').innerText = document.getElementById('studentName').value;
            document.getElementById('outClass').innerText = document.getElementById('studentClass').value;
            document.getElementById('outCenter').innerText = document.getElementById('centerName').value;
            document.getElementById('outDate').innerText = document.getElementById('examDate').value;
            document.getElementById('hallTicket').style.display = 'block';
            document.getElementById('downloadBtn').style.display = 'block';
        });
        function downloadPDF() {
            const element = document.getElementById('hallTicket');
            html2pdf().from(element).save('Hall_Ticket.pdf');
        }
    </script>
</body>
</html>
